services:
  blockscout-db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: blockscout
      POSTGRES_PASSWORD: blockscout
      POSTGRES_DB: blockscout
    ports:
      - "5432:5432"
    # Increase allowed concurrent connections for Blockscout's multiple repos
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockscout -d blockscout"]
      interval: 5s
      timeout: 3s
      retries: 30

  blockscout:
    image: blockscout/blockscout:latest
    depends_on:
      blockscout-db:
        condition: service_healthy
    command: ["sh", "-lc", "/app/bin/blockscout eval 'Ecto.Migrator.with_repo(Explorer.Repo, &Ecto.Migrator.run(&1, :up, all: true))' && /app/bin/blockscout start"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgres://blockscout:blockscout@blockscout-db:5432/blockscout
      ECTO_USE_SSL: "false"
      ETHEREUM_JSONRPC_HTTP_URL: http://host.docker.internal:8545
      ETHEREUM_JSONRPC_WS_URL: ws://host.docker.internal:8545
      NETWORK_NAME: "Local Anvil"
      CHAIN_ID: "31337"
      PORT: "4000"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-dev-secret-change-me-and-make-this-long}
      RELEASE_COOKIE: ${RELEASE_COOKIE:-dev-cookie}
      # Reduce DB connection pools for local dev to avoid exhausting Postgres
      POOL_SIZE: "10"
      POOL_SIZE_API: "5"
      ACCOUNT_POOL_SIZE: "5"
      MUD_POOL_SIZE: "1"
    ports:
      - "4000:4000"
