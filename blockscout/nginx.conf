# Simple CORS + WebSocket reverse proxy for Blockscout API
# Listens on 4001 (HTTP) and proxies to blockscout:4000 inside the compose network

worker_processes  1;

events { worker_connections 1024; }

http {
  # Support proxying websockets
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 4001;
    server_name _;

    # Global CORS headers (single source of truth)
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'x-apollo-tracing,Authorization,Content-Type,Accept,Origin,User-Agent,DNT,Cache-Control,X-Mx-ReqToken,Keep-Alive,X-Requested-With,If-Modified-Since,X-CSRF-Token,updated-gas-oracle' always;
    add_header 'Access-Control-Max-Age' '1728000' always;

    # Preflight short-circuit
    if ($request_method = OPTIONS) {
      return 204;
    }

    location /socket/ {
      proxy_pass http://blockscout:4000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      # Drop upstream CORS headers to avoid duplicates
      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Credentials;
      proxy_hide_header Access-Control-Allow-Methods;
      proxy_hide_header Access-Control-Allow-Headers;
      proxy_hide_header Access-Control-Expose-Headers;
    }

    location / {
      proxy_pass http://blockscout:4000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      # Drop upstream CORS headers to avoid duplicates
      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Credentials;
      proxy_hide_header Access-Control-Allow-Methods;
      proxy_hide_header Access-Control-Allow-Headers;
      proxy_hide_header Access-Control-Expose-Headers;
    }
  }
}
